<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="特賣會">
<meta name="theme-color" content="#f5f4ef" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1c1c1a" media="(prefers-color-scheme: dark)">
<title>特賣會儀表板</title>
<style>
:root{
  --bg:#f5f4ef;--card:#ffffff;--sub:#f0efe9;--text:#1f1e1c;--text2:#6b6a65;--text3:#9a9893;--line:rgba(0,0,0,.09);
  --red:#c8382f;--red-bg:#fbe9e7;--amber:#a8640c;--amber-bg:#fbf0dc;--green:#3d7a1f;--green-bg:#eaf3de;
  --blue:#2f6fb5;--blue-bg:#e6f0fb;--gray-bg:#efeee9;--tw:#d8602e;--us:#3a83d6;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#1c1c1a;--card:#262624;--sub:#2f2f2c;--text:#ecebe6;--text2:#a9a8a2;--text3:#7d7c77;--line:rgba(255,255,255,.1);
  --red:#f0827a;--red-bg:#4a1f1c;--amber:#f0b45c;--amber-bg:#45300f;--green:#9fd17a;--green-bg:#253815;
  --blue:#8dbcf0;--blue-bg:#1b3350;--gray-bg:#33332f;
}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC",sans-serif;
  -webkit-text-size-adjust:100%;padding:calc(env(safe-area-inset-top) + 12px) 16px calc(env(safe-area-inset-bottom) + 28px)}
main{max-width:520px;margin:0 auto}
header{display:flex;justify-content:space-between;align-items:baseline;margin:4px 2px 12px}
h1{font-size:20px;font-weight:600;margin:0}
.muted{color:var(--text2);font-size:12px}
.tiny{color:var(--text3);font-size:11px}
.card{background:var(--card);border:.5px solid var(--line);border-radius:14px;padding:14px 16px;margin-top:10px}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px}
.h{font-size:15px;font-weight:600}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.tile{background:var(--card);border:.5px solid var(--line);border-radius:14px;padding:12px 14px}
.tile.hl{border:2px solid var(--amber)}
.tile.hl.red{border-color:var(--red)}
.big{font-size:38px;font-weight:600;line-height:1.15;font-variant-numeric:tabular-nums}
.pill{display:inline-block;font-size:12px;padding:2px 9px;border-radius:7px;font-weight:500}
.z-漲價中{background:var(--blue-bg);color:var(--blue)} .z-原價{background:var(--gray-bg);color:var(--text2)}
.z-開始打折{background:var(--amber-bg);color:var(--amber)} .z-特賣會{background:var(--red-bg);color:var(--red)}
.quad{display:grid;grid-template-columns:30px repeat(2,minmax(0,1fr));gap:5px;font-size:12px;text-align:center;margin-top:8px}
.quad .c{background:var(--sub);border-radius:8px;padding:11px 4px;color:var(--text2)}
.quad .c.on{background:var(--amber-bg);color:var(--amber);font-weight:600;outline:1.5px solid var(--amber)}
.quad .v{color:var(--text3);font-size:11px;align-self:center;line-height:1.3}
.action{border:.5px solid var(--blue);}
.ind{display:grid;grid-template-columns:96px minmax(0,1fr) 62px;gap:9px 8px;align-items:center;font-size:13px;margin-top:10px}
.bar{height:6px;background:var(--sub);border-radius:3px;overflow:hidden}
.bar i{display:block;height:6px;border-radius:3px}
.num{text-align:right;font-variant-numeric:tabular-nums}
.checks{font-size:13px;line-height:1.95;margin-top:4px}
.ok{color:var(--green)} .no{color:var(--red)}
.sep{border-top:.5px solid var(--line);margin-top:12px;padding-top:10px}
svg{display:block;width:100%}
.chips{display:flex;gap:6px;overflow-x:auto;margin-top:10px;padding-bottom:2px}
.chip{font:inherit;font-size:12px;padding:6px 11px;border-radius:8px;border:.5px solid var(--line);background:var(--sub);color:var(--text);white-space:nowrap}
.chip.on{background:var(--blue-bg);color:var(--blue);border-color:var(--blue)}
input[type=range]{width:100%;margin:8px 0 2px;accent-color:var(--tw)}
.legend{font-size:11px;display:flex;gap:12px;margin-top:4px;color:var(--text2)}
.note{font-size:12px;color:var(--text2);line-height:1.6;margin-top:8px}
.err{color:var(--red);font-size:14px;padding:20px 4px}
details.help{margin-top:12px;border-top:.5px solid var(--line);padding-top:10px}
details.help>summary{list-style:none;cursor:pointer;font-size:13px;color:var(--blue);display:flex;justify-content:space-between}
details.help>summary::-webkit-details-marker{display:none}
details.help .chev{transition:transform .2s}details.help[open] .chev{transform:rotate(90deg)}
details.help dl{margin:8px 0 0;font-size:13px;line-height:1.6}
details.help dt{font-weight:600;margin-top:10px}details.help dd{margin:2px 0 0;color:var(--text2)}
details.fold{margin-top:10px}
details.fold>summary{list-style:none;cursor:pointer;background:var(--card);border:.5px solid var(--line);border-radius:14px;padding:14px 16px;display:flex;justify-content:space-between;align-items:center}
details.fold>summary::-webkit-details-marker{display:none}
details.fold>summary .chev{transition:transform .2s;color:var(--text3);font-size:14px}
details.fold[open]>summary .chev{transform:rotate(90deg)}
details.fold .when-open{display:none}details.fold[open] .when-open{display:inline}details.fold[open] .when-closed{display:none}
details.fold[open]>summary{border-radius:14px 14px 0 0;border-bottom:none}
details.fold>.body>.card:first-child{margin-top:0;border-top-left-radius:0;border-top-right-radius:0;border-top:none;padding-top:4px}
</style>
</head>
<body>
<main>
  <header><h1>特賣會儀表板</h1><span class="muted" id="updated"></span></header>
  <div id="app"><p class="muted">載入中…</p></div>
</main>
<script>
const ZONES=[[0,20,"漲價中"],[20,60,"原價"],[60,80,"開始打折"],[80,101,"特賣會"]];
const zone=s=>s==null?"—":ZONES.find(z=>s>=z[0]&&s<z[1])[2];
const zcol=s=>s==null?"var(--text3)":s>=80?"var(--red)":s>=60?"var(--amber)":"#b4b2a9";
const r0=v=>v==null?"—":Math.round(v);
const fx=(v,d=1)=>v==null||isNaN(v)?"—":Number(v).toFixed(d);
const esc=s=>String(s).replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
const EVENTS=[
  {name:"2026/7 AI 股修正",from:"2026-06-20",to:"2026-08-31",notes:{"2026-07-16":"台積電法說會","2026-07-17":"法說會隔天，單日跌 2,953 點，史上最大跌點","2026-07-28":"再跌 2,030 點，史上第三大跌點"}},
  {name:"2025/4 關稅",from:"2025-03-15",to:"2025-05-31",notes:{"2025-04-07":"關稅衝擊，台股連假後開盤重挫"}},
];

function ma(arr,i,n){if(i<n-1)return null;let s=0;for(let k=i-n+1;k<=i;k++){if(arr[k]==null)return null;s+=arr[k]}return s/n}

function action(t,i,tw){
  if(t.退潮)return "可以進場搶購：台股退潮訊號全部觸發。分批進場，個股以投信、三大法人方向確認後再買";
  const idx=tw.map(x=>x.raw.TAIEX), m=ma(idx,i,60), above=m!=null&&idx[i]>m;
  const ma60=m==null?"":(above?"TAIEX 站上 MA60":"TAIEX 跌破 MA60");
  switch(t.quadrant){
    case "本土事件":return `${ma60} ＋ 本土事件 → 美股穩住，準備購物清單，等台股退潮訊號再分批進場`;
    case "預警":return `${ma60} ＋ 預警 → 美股先恐慌、台股可能還沒反應：暫停加碼、檢查停損`;
    case "系統性恐慌":return `${ma60} ＋ 系統性恐慌 → 全面特賣但人潮洶湧，別擠第一波，等退潮訊號`;
    default:
      if(t.score!=null&&t.score<20)return `${ma60} ＋ 台股漲價中 → 市場偏熱，別追高，依減碼紀律檢視獲利部位`;
      return above?`${ma60} ＋ 正常環境 → 照平常紀律操作`:`${ma60} ＋ 正常環境 → 大盤在季線下，維持防守`;
  }
}

function indRows(list){
  return list.map(([name,p,val])=>`<span>${name}</span><div class="bar"><i style="width:${p==null?0:p}%;background:${zcol(p)}"></i></div><span class="num">${val}</span>`).join("");
}

function twInd(tw,i){
  const t=tw[i],r=t.raw,I=t.indicators,p10=tw[i-10];
  const mchg=p10&&r.margin_amt_k&&p10.raw.margin_amt_k?(r.margin_amt_k/p10.raw.margin_amt_k-1)*100:null;
  const fchg=p10&&r.fut_foreign_net_oi!=null&&p10.raw.fut_foreign_net_oi!=null?(r.fut_foreign_net_oi-p10.raw.fut_foreign_net_oi):null;
  return [["融資維持率",I["融資維持率(反向)"],fx(r.margin_maint)+"%"],
          ["融資 10 日",I["融資10日變化(反向)"],mchg==null?"—":(mchg>0?"+":"")+fx(mchg)+"%"],
          ["臺指 VIX",I["臺指VIX"],fx(r.tvix)],
          ["外資期貨",I["外資期貨淨空單10日變化"],fchg==null?"—":(fchg>0?"+":"")+(fchg/10000).toFixed(1)+"萬口"],
          ["跌破季線",I["跌破季線比例"],r.below_ma60_pct==null?"—":fx(r.below_ma60_pct,0)+"%"]];
}
function usInd(u){
  const r=u.raw,I=u.indicators;
  return [["HY 利差",I["HY利差"],"僅顯示分數"],
          ["IG 利差",I["IG利差"],"僅顯示分數"],
          ["JNK/IEF",I["JNK/IEF回撤"],fx(r["JNK/IEF"],3)],
          ["VIX",I["VIX"],fx(r.VIX)],
          ["期限結構",I["VIX期限結構"],fx(r["VIX期限結構"],2)],
          ["MOVE",I["MOVE"],fx(r.MOVE,0)]];
}
function checks(sig,recent=true){
  const ks=Object.keys(sig).filter(k=>sig[k]!==null),na=Object.keys(sig).filter(k=>sig[k]===null),n=ks.filter(k=>sig[k]).length;
  if(!recent)return {n:null,total:ks.length,title:"未啟動",html:'<div class="muted" style="font-size:13px">近 20 天沒有進入特賣會，退潮訊號不適用</div>'};
  return {n,total:ks.length,title:`${n} / ${ks.length}`,html:ks.map(k=>`<div><span class="${sig[k]?"ok":"no"}">${sig[k]?"✓":"✗"}</span> ${k}</div>`).join("")+na.map(k=>`<div class="muted" style="font-size:13px">— ${k}（當時無資料）</div>`).join("")};
}

function lineChart(series,{h=90,markIdx=null,band=true,index=null}={}){
  const W=320,n=series[0].data.length,X=i=>n<2?0:i*(W/(n-1)),Y=v=>h-4-(v/100)*(h-12);
  let s=`<svg viewBox="0 0 ${W} ${h+(index?60:0)}" role="img">`;
  let off=0;
  if(index){
    const vals=index.filter(v=>v!=null),mn=Math.min(...vals),mx=Math.max(...vals),Yi=v=>6+(mx-v)/(mx-mn||1)*48;
    s+=`<polyline fill="none" stroke="var(--text)" stroke-width="1" points="${index.map((v,i)=>v==null?"":X(i)+","+Yi(v)).join(" ")}"/>`;
    s+=`<text x="2" y="10" font-size="10" fill="var(--text3)">加權指數</text>`;off=60;
  }
  s+=`<g transform="translate(0,${off})">`;
  if(band)s+=`<rect x="0" y="${Y(100)}" width="${W}" height="${Y(80)-Y(100)}" fill="var(--red)" opacity=".08"/><line x1="0" x2="${W}" y1="${Y(60)}" y2="${Y(60)}" stroke="var(--line)" stroke-dasharray="3 3"/><text x="${W-2}" y="${Y(60)-3}" text-anchor="end" font-size="10" fill="var(--text3)">60</text>`;
  for(const se of series)s+=`<polyline fill="none" stroke="${se.color}" stroke-width="1.6" points="${se.data.map((v,i)=>v==null?"":X(i)+","+Y(v)).join(" ")}"/>`;
  s+=`</g>`;
  if(markIdx!=null)s+=`<line x1="${X(markIdx)}" x2="${X(markIdx)}" y1="0" y2="${h+off}" stroke="var(--text2)" stroke-width=".8" stroke-dasharray="3 2"/>`;
  return s+"</svg>";
}

function lastSale(arr,uptoDate){
  // 最近一次特賣會（連續 ≥80 的區段）的最高分那天
  const a=arr.filter(r=>r.score!=null&&r.date<=uptoDate);
  let k=a.length-1; while(k>=0&&a[k].score<80)k--;
  if(k<0)return null;
  // 往前找同一波：中間短暫跌破 80 不超過 10 個交易日，視為同一次特賣會
  let j=k,gap=0; for(let m=k-1;m>=0;m--){ if(a[m].score>=80){j=m;gap=0} else if(++gap>10)break }
  let best=a[j]; for(let m=j;m<=k;m++)if(a[m].score>best.score)best=a[m];
  return {...best,ongoing:k===a.length-1};
}
function saleLine(D,date){
  const fmt=(x,name,withIdx)=>{
    if(!x)return `<div><span class="muted" style="font-size:13px">${name}</span>　近 2 年沒有</div>`;
    const days=Math.round((new Date(date)-new Date(x.date))/864e5);
    const ago=x.ongoing?'<b style="color:var(--red)">進行中</b>':`${days} 天前`;
    const ix=withIdx&&x.raw&&x.raw.TAIEX?`・加權 ${Math.round(x.raw.TAIEX).toLocaleString()}`:"";
    return `<div class="row" style="font-size:13px;padding:2px 0"><span><span class="muted" style="font-size:13px">${name}</span>　${x.date.replace(/-/g,"/")}　<b>${Math.round(x.score)}</b> 分${ix}</span><span class="tiny">${ago}</span></div>`;
  };
  return `<div class="card" style="padding:10px 16px"><div class="tiny" style="margin-bottom:2px">最近一次特賣會（那一波的最高分）</div>
    ${fmt(lastSale(D.tw,date),"台股",true)}${fmt(lastSale(D.us,date),"美股",false)}</div>`;
}

const HELP_TW=[
 ["長條代表什麼","每項指標換算成 0–100 的恐慌程度：一半看近 2 年的相對位置，一半看長期常態。越長越恐慌，60 以上變橘色、80 以上變紅色。右邊是實際數值。"],
 ["融資維持率","散戶借錢買股的擔保比率（股票市值 ÷ 借款）。股價下跌就會降低，個股低於 130% 會被追繳，補不足就被強制賣出（斷頭）。越低越恐慌，大盤跌到 150% 以下壓力就很明顯。"],
 ["融資 10 日","融資餘額 10 天來的變化。快速減少代表散戶被迫或主動退場，也就是俗稱的「洗融資」。減少越多越恐慌；反過來大增則代表槓桿過熱。"],
 ["臺指 VIX","期交所用台指選擇權算出的預期波動率，台灣版的恐慌指數。越高代表市場預期未來波動越大。"],
 ["外資期貨","外資台指期貨淨部位 10 天來的變化。負值代表外資加碼空單（看空或為現貨避險），空單增加越快越恐慌。"],
 ["跌破季線","上市普通股中，收盤價低於 60 日均線的比例。比例越高代表跌勢越全面，而不只是少數權值股在跌。"],
 ["退潮訊號","近 20 天分數曾到 75 以上才會啟動，檢查恐慌是否開始消退：融資維持率止跌回升、跌破季線的股票變少、臺指 VIX 從高點回落。全部成立才是「可以進場搶購」。"]];
const HELP_US=[
 ["長條代表什麼","同台股：0–100 的恐慌程度，相對位置與長期常態各半。"],
 ["HY 利差","高收益債（垃圾債）比美國公債多要求的利息。企業倒債風險升高時會擴大，常比股市更早反映壞消息。越高越恐慌。"],
 ["IG 利差","投資等級債（體質好的大企業）的利差。連好公司的利差都擴大，代表恐慌已經擴散成系統性問題。"],
 ["JNK/IEF","垃圾債 ETF 除以中期美債 ETF 的比值。比值下跌代表資金逃離風險資產；長條看的是從一年高點回落了多少。"],
 ["VIX","用標普 500 選擇權算出的未來 30 天預期波動，俗稱恐慌指數。20 左右是常態，30 以上就是明顯恐慌。"],
 ["期限結構","VIX ÷ VIX3M（未來 3 個月的預期波動）。平常小於 1；大於 1 代表短期恐慌超過長期擔憂，是急性恐慌的特徵。回到 1 以下是退潮訊號之一。"],
 ["MOVE","美債市場的 VIX，用美債選擇權算出的預期波動率。美債是全球資產定價的基準，債市一亂，股市也很難穩。100 左右是常態，120 以上偏高。"],
 ["STLFSI","聖路易聯準會編製的金融壓力指數，綜合 18 項利率、利差與波動率數據。0 代表平均，大於 0 壓力高於常態，大於 1 就很明顯。只做交叉驗證，不計入分數。"],
 ["退潮訊號","近 20 天曾出現真正恐慌（分數 ≥80、VIX ≥20 且期限結構 ≥1）才會啟動：期限結構回到 1 以下，加上信用利差開始收斂。"]];
const helpBox=list=>`<details class="help"><summary><span>指標說明</span><span class="chev">▶</span></summary><dl>${list.map(([k,v])=>`<dt>${k}</dt><dd>${v}</dd>`).join("")}</dl></details>`;

const heatTag=r=>r&&r.heat?`<div style="margin-top:4px;font-size:12px;color:var(--amber);font-weight:600">▲ 升溫中：5 日 +${Math.round(r.chg5)}</div>`:"";
function usDST(d){ // 美國夏令時間：3 月第二個週日～11 月第一個週日
  const y=d.getUTCFullYear(),sun=(m,n)=>{const x=new Date(Date.UTC(y,m,1));return 1+((7-x.getUTCDay())%7)+7*(n-1)};
  const a=Date.UTC(y,2,sun(2,2)),b=Date.UTC(y,10,sun(10,1)),t=d.getTime();return t>=a&&t<b;
}
function eventsCard(D){
  const ev=D.events||[]; if(!ev.length)return "";
  const today=new Date(new Date().toLocaleString("en-US",{timeZone:"Asia/Taipei"})),t0=today.toISOString().slice(0,10);
  const end=new Date(today.getTime()+7*864e5).toISOString().slice(0,10);
  const list=ev.filter(e=>e.date>=t0&&e.date<=end); if(!list.length)return "";
  const wd="日一二三四五六";
  const rows=list.map(e=>{
    const d=new Date(e.date+"T12:00:00Z"),dst=usDST(d),md=e.date.slice(5).replace("-","/");
    const tw=e.market==="tw";
    const when=tw?`台灣 ${e.time||""} 盤後`:e.name.startsWith("FOMC")?`台灣隔天凌晨 ${dst?"2":"3"}:00`:`台灣 ${dst?"20":"21"}:30`;
    const tag=tw?"台":"美";
    return `<div class="row" style="font-size:13px;padding:3px 0"><span><span class="pill" style="font-size:11px;padding:1px 6px;margin-right:6px;background:var(--sub);color:var(--text2)">${tag}</span><b>${md}</b>（${wd[d.getUTCDay()]}）${e.name}${e.estimated?'<span class="tiny">（預估）</span>':""}</span><span class="tiny">${when}</span></div>`;}).join("");
  return `<div class="card" style="padding:10px 16px"><div class="tiny" style="margin-bottom:2px">未來 7 天重要事件・公布前後容易出現波動</div>${rows}</div>`;
}

const IND_NAME={"融資維持率(反向)":"融資維持率","融資10日變化(反向)":"融資 10 日","臺指VIX":"臺指 VIX","外資期貨淨空單10日變化":"外資期貨","跌破季線比例":"跌破季線","HY利差":"HY 利差","IG利差":"IG 利差","JNK/IEF回撤":"JNK/IEF","VIX":"VIX","VIX期限結構":"期限結構","MOVE":"MOVE"};
const missTag=r=>r&&r.missing&&r.missing.length?`<div class="tiny" style="color:var(--amber);margin-top:4px">本日缺少：${r.missing.map(k=>IND_NAME[k]||k).join("、")}，分數只用其餘指標計算</div>`:"";
function staleBanner(D){
  const now=new Date(new Date().toLocaleString("en-US",{timeZone:"Asia/Taipei"}));
  const bdays=d=>{let n=0,x=new Date(d+"T12:00:00");x.setDate(x.getDate()+1);while(x<=now){const w=x.getDay();if(w&&w<6)n++;x.setDate(x.getDate()+1)}return n};
  const tw=D.tw.at(-1),us=D.us.at(-1),msg=[];
  if(bdays(tw.date)>2)msg.push(`台股資料停在 ${tw.date.slice(5)}`);
  if(bdays(us.date)>3)msg.push(`美股資料停在 ${us.date.slice(5)}`);
  return msg.length?`<div class="card" style="border:1.5px solid var(--red);background:var(--red-bg);color:var(--red);font-size:13px;line-height:1.6"><b>資料停更</b>：${msg.join("、")}。分數可能已過期，請勿依此判斷，並檢查 GitHub 專案的 Actions 頁面。</div>`:"";
}

function dayCard(D,i,{compact=false}={}){
  const tw=D.tw,t=tw[i];
  const usRow=D.us.filter(u=>u.date<=t.date).slice(-1)[0];
  const prev=tw[i-1],dTw=prev?t.score-prev.score:null;
  const twc=checks(t.signals,t.recent),usc=usRow?checks(usRow.signals,usRow.recent):null;
  const hl=t.score>=60?("hl"+(t.score>=80?" red":"")):"";
  const q=t.quadrant;
  const cell=(name)=>`<div class="c ${q===name?"on":""}">${name}${q===name?" ●":""}</div>`;
  let html=`
  <div class="grid2" style="margin-top:${compact?10:0}px">
    <div class="tile ${hl}"><div class="muted">台股 · 怎麼做</div><div class="big">${r0(t.score)}</div>
      <span class="pill z-${zone(t.score)}">${zone(t.score)}</span>
      <div class="tiny" style="margin-top:6px">台股資料 ${t.date.slice(5)}${dTw==null?"":"・較前日 "+(dTw>0?"+":"")+Math.round(dTw)}</div>${heatTag(t)}</div>
    <div class="tile ${t.us_score>=60?"hl"+(t.us_score>=80?" red":""):""}"><div class="muted">美股 · 怎麼看</div><div class="big">${r0(t.us_score)}</div>
      <span class="pill z-${zone(t.us_score)}">${zone(t.us_score)}</span>
      <div class="tiny" style="margin-top:6px">${usRow?"美股資料 "+usRow.date.slice(5):""}</div>${heatTag(usRow)}</div>
  </div>
  ${compact?"":saleLine(D,t.date)}
  <div class="card"><div class="row"><span class="h">目前狀態：${q||"—"}</span><span class="tiny">≥60 視為恐慌側</span></div>
    <div class="quad"><span></span><span class="tiny">台股平靜</span><span class="tiny">台股恐慌</span>
      <span class="v">美股<br>平靜</span>${cell("正常環境")}${cell("本土事件")}
      <span class="v">美股<br>恐慌</span>${cell("預警")}${cell("系統性恐慌")}</div></div>
  <div class="card action"><div class="h" style="margin-bottom:4px">對應行動</div><div style="font-size:14px;line-height:1.7">${esc(action(t,i,tw))}</div></div>
  ${compact?"":eventsCard(D)}`;
  if(compact)return html+`<div class="card"><div class="h">台股退潮訊號：${twc.title}</div><div class="checks">${twc.html}</div></div>`;
  html+=`
  <div class="card"><div class="row"><span class="h">台股指標</span><span class="tiny">百分位 / 數值　${t.date}</span></div>${missTag(t)}
    <div class="ind">${indRows(twInd(tw,i))}</div>
    <div class="sep"><div class="h" style="font-size:14px">台股退潮訊號：${twc.title}</div><div class="checks">${twc.html}</div></div>${helpBox(HELP_TW)}</div>`;
  if(usRow)html+=`
  <div class="card"><div class="row"><span class="h">美股指標</span><span class="tiny">${usRow.date}</span></div>${missTag(usRow)}
    <div class="ind">${indRows(usInd(usRow))}</div>
    <div class="sep"><div class="h" style="font-size:14px">美股退潮訊號：${usc.title}</div><div class="checks">${usc.html}</div></div>
    <div class="sep row" style="font-size:13px"><span class="muted" style="font-size:13px">交叉驗證 STLFSI</span><span>${fx(usRow.raw.STLFSI,2)} ${usRow.raw.STLFSI==null?"":usRow.raw.STLFSI>1?"偏高":usRow.raw.STLFSI>0?"略高":"正常"}</span></div>${helpBox(HELP_US)}</div>`;
  return html;
}

function trend(D){
  const tw=D.tw.slice(-60),n=tw.length,W=320,H=110,X=i=>n<2?0:i*(W/(n-1)),Y=v=>H-4-(v/100)*(H-12);
  const line=(k,c)=>`<polyline fill="none" stroke="${c}" stroke-width="1.6" points="${tw.map((x,i)=>x[k]==null?"":X(i)+","+Y(x[k])).join(" ")}"/>`;
  const md=d=>d.slice(5).replace("-","/");
  const ticks=[0,Math.floor((n-1)/2),n-1].map(i=>`<text x="${X(i)}" y="${H+14}" font-size="10" fill="var(--text3)" text-anchor="${i===0?"start":i===n-1?"end":"middle"}">${md(tw[i].date)}</text>`).join("");
  const box=document.createElement("div");
  box.className="card";
  box.innerHTML=`<div class="row"><span class="h">近 60 日走勢</span>
      <span class="legend" style="margin:0"><span style="color:var(--tw)">— 台股</span><span style="color:var(--us)">— 美股</span></span></div>
    <div class="row" style="margin:8px 0 0;font-size:13px;font-variant-numeric:tabular-nums">
      <span id="tr-d" style="font-weight:600"></span><span id="tr-q" class="muted" style="font-size:13px"></span></div>
    <div style="font-size:13px;margin:2px 0;font-variant-numeric:tabular-nums">
      <span style="color:var(--tw)">台股 <b id="tr-t"></b></span>　<span style="color:var(--us)">美股 <b id="tr-u"></b></span></div>
    <svg viewBox="0 0 ${W} ${H+18}" id="tr-svg" style="touch-action:pan-y;cursor:crosshair" role="img" aria-label="近 60 日台股與美股分數走勢">
      <rect x="0" y="${Y(100)}" width="${W}" height="${Y(80)-Y(100)}" fill="var(--red)" opacity=".08"/>
      <line x1="0" x2="${W}" y1="${Y(60)}" y2="${Y(60)}" stroke="var(--line)" stroke-dasharray="3 3"/>
      <text x="${W-2}" y="${Y(60)-3}" text-anchor="end" font-size="10" fill="var(--text3)">60</text>
      ${line("score","var(--tw)")}${line("us_score","var(--us)")}
      <line id="tr-x" y1="0" y2="${H}" stroke="var(--text2)" stroke-width=".8" stroke-dasharray="3 2"/>
      <circle id="tr-ct" r="3.5" fill="var(--tw)"/><circle id="tr-cu" r="3.5" fill="var(--us)"/>
      ${ticks}
    </svg><div class="tiny" style="text-align:center;margin-top:2px">在圖上點按或左右滑動查看每天的分數</div>`;
  const q=id=>box.querySelector("#"+id), svg=q("tr-svg");
  function show(i){
    const x=tw[i];
    q("tr-d").textContent=x.date.replace(/-/g,"/");q("tr-q").textContent=x.quadrant||"";
    q("tr-t").textContent=r0(x.score)+" "+zone(x.score); q("tr-u").textContent=r0(x.us_score)+" "+zone(x.us_score);
    for(const [id,v] of [["tr-x",null],["tr-ct",x.score],["tr-cu",x.us_score]]){
      const e=q(id);
      if(id==="tr-x"){e.setAttribute("x1",X(i));e.setAttribute("x2",X(i));continue}
      if(v==null){e.setAttribute("r",0);continue}
      e.setAttribute("r",3.5);e.setAttribute("cx",X(i));e.setAttribute("cy",Y(v));
    }
  }
  function at(ev){
    const r=svg.getBoundingClientRect(),fx=(ev.clientX-r.left)/r.width;
    show(Math.max(0,Math.min(n-1,Math.round(fx*(n-1)))));
  }
  svg.addEventListener("pointerdown",at);
  svg.addEventListener("pointermove",ev=>{if(ev.pointerType!=="mouse"||ev.buttons)at(ev)});
  show(n-1);
  return box;
}

function guide(D){
  const freq=arr=>{const v=arr.map(x=>x.score).filter(x=>x!=null),c=[0,0,0,0];v.forEach(x=>c[x>=80?3:x>=60?2:x>=20?1:0]++);return c.map(k=>Math.round(k/v.length*100))};
  const ft=freq(D.tw),fu=freq(D.us);
  const rows=[["漲價中","0–20","市場過度樂觀，東西都很貴，別追高"],["原價","20–60","大部分時候都在這裡，照平常紀律操作"],
              ["開始打折","60–80","恐慌升溫，準備購物清單，先不出手"],["特賣會","80–100","極度恐慌，人潮洶湧，別擠第一波，等退潮訊號"]];
  const peak=(arr,e)=>{const x=arr.filter(r=>r.date>=e.from&&r.date<=e.to&&r.score!=null);if(!x.length)return "—";const m=x.reduce((a,b)=>b.score>a.score?b:a);return `${Math.round(m.score)}（${m.date.slice(5).replace("-","/")}）`};
  const box=document.createElement("details");box.className="fold";
  box.innerHTML=`<summary><span class="h">分數怎麼看</span><span class="row" style="gap:8px"><span class="tiny when-closed">區間與歷史參考</span><span class="tiny when-open">收起</span><span class="chev">▶</span></span></summary>
  <div class="body"><div class="card">
    <div class="tiny" style="margin-bottom:6px">分數越高＝恐慌越深＝折扣越大。灰字是近 ${Math.round(D.tw.length/250*10)/10} 年各區間出現的天數比例</div>
    ${rows.map(([z,r,t],i)=>`<div style="display:grid;grid-template-columns:78px 1fr;gap:4px 10px;padding:9px 0;border-top:${i?".5px solid var(--line)":"none"}">
      <div><span class="pill z-${z}">${z}</span><div class="tiny" style="margin-top:4px">${r}</div></div>
      <div style="font-size:13px;line-height:1.55">${t}<div class="tiny">台股 ${ft[i]}%・美股 ${fu[i]}% 的日子</div></div></div>`).join("")}
    <div class="sep"><div class="h" style="font-size:14px;margin-bottom:4px">歷史參考：股災時最高到幾分</div>
      ${EVENTS.map(e=>`<div style="font-size:13px;padding:4px 0"><div>${e.name}</div><div class="muted" style="font-size:13px;font-variant-numeric:tabular-nums">台股 ${peak(D.tw,e)}　美股 ${peak(D.us,e)}</div></div>`).join("")}
      <div class="note">分數是相對過去兩年＋長期常態的綜合評估，不是跌幅。到達特賣會不代表已經最便宜，真正的進場訊號是「退潮訊號」全部觸發。<br>「▲ 升溫中」：分數 5 個交易日內上升 15 分以上（分數在 40～80 之間），代表恐慌正在快速累積，即使還沒到開始打折也值得留意。</div></div>
  </div></div>`;
  return box;
}

function replay(D){
  const box=document.createElement("details");
  box.className="fold";
  box.innerHTML=`<summary><span class="h">股災回放</span><span class="row" style="gap:8px"><span class="tiny when-closed">需要時再展開</span><span class="tiny when-open">收起</span><span class="chev">▶</span></span></summary>
    <div class="body"><div class="card"><div class="row"><span class="tiny">只用當天以前的資料計算</span></div>
    <div class="chips">${EVENTS.map((e,k)=>`<button class="chip ${k?"":"on"}" data-k="${k}">${e.name}</button>`).join("")}</div>
    <div id="rp-chart"></div><div class="legend"><span>— 加權指數</span><span style="color:var(--tw)">— 台股</span><span style="color:var(--us)">— 美股</span></div>
    <input type="range" id="rp-sl" step="1" aria-label="選擇日期"><div class="row tiny"><span id="rp-a"></span><span id="rp-b"></span></div>
    <div class="row" style="margin-top:10px"><span class="h" id="rp-d"></span><span id="rp-ix" style="font-size:13px"></span></div>
    <div class="note" id="rp-note"></div></div><div id="rp-card"></div></div>`;
  let ev=0,rows=[];
  const sl=box.querySelector("#rp-sl");
  function pick(k){
    ev=k;const e=EVENTS[k];
    rows=D.tw.map((x,i)=>[x,i]).filter(([x])=>x.date>=e.from&&x.date<=e.to);
    box.querySelectorAll(".chip").forEach(b=>b.classList.toggle("on",+b.dataset.k===k));
    if(!rows.length){box.querySelector("#rp-chart").innerHTML='<p class="muted">這段期間沒有分數資料</p>';box.querySelector("#rp-card").innerHTML="";return}
    sl.min=0;sl.max=rows.length-1;
    let peak=0;rows.forEach(([x],j)=>{if(x.score>rows[peak][0].score)peak=j});sl.value=peak;
    box.querySelector("#rp-a").textContent=rows[0][0].date.slice(5);box.querySelector("#rp-b").textContent=rows.at(-1)[0].date.slice(5);
    draw();
  }
  function draw(){
    const j=+sl.value,[t,i]=rows[j],e=EVENTS[ev];
    box.querySelector("#rp-chart").innerHTML=lineChart([{data:rows.map(([x])=>x.score),color:"var(--tw)"},{data:rows.map(([x])=>x.us_score),color:"var(--us)"}],{markIdx:j,index:rows.map(([x])=>x.raw.TAIEX)});
    const p=D.tw[i-1],ch=p?t.raw.TAIEX-p.raw.TAIEX:0;
    box.querySelector("#rp-d").textContent=t.date;
    box.querySelector("#rp-ix").innerHTML=`加權 ${Math.round(t.raw.TAIEX).toLocaleString()} <span style="color:${ch<0?"var(--green)":"var(--red)"}">${ch>0?"+":""}${Math.round(ch).toLocaleString()}</span>`;
    box.querySelector("#rp-note").textContent=e.notes[t.date]||"";
    box.querySelector("#rp-card").innerHTML=dayCard(D,i,{compact:true});
  }
  sl.addEventListener("input",draw);
  box.querySelectorAll(".chip").forEach(b=>b.addEventListener("click",()=>pick(+b.dataset.k)));
  let inited=false;
  box.addEventListener("toggle",()=>{if(box.open&&!inited){inited=true;pick(0)}});
  return box;
}

fetch("data.json?"+Date.now()).then(r=>r.json()).then(D=>{
  document.getElementById("updated").textContent=D.updated+" 更新";
  const app=document.getElementById("app");
  if(!D.tw.length){app.innerHTML='<p class="err">還沒有分數資料</p>';return}
  app.innerHTML=staleBanner(D)+dayCard(D,D.tw.length-1);
  app.appendChild(trend(D));
  app.appendChild(guide(D));
  app.appendChild(replay(D));
}).catch(e=>{document.getElementById("app").innerHTML='<p class="err">資料載入失敗：'+esc(e.message)+'</p>'});
</script>
</body>
</html>
