name: 連線測試

on:
  push:
    paths:
      - "tests/**"
      - ".github/workflows/connectivity-test.yml"
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - run: python tests/connectivity_test.py
