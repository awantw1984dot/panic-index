name: 連線測試

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests yfinance pandas
      - run: python tests/probe_tw.py | tee tests/probe_tw_result.txt
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
      - name: 把測試結果存回專案
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          mkdir -p /tmp/keep && cp -r --parents tests/*result*.txt /tmp/keep/ 2>/dev/null || true
          git fetch -q origin main && git reset -q --hard origin/main
          cp -r /tmp/keep/. . 
          git add tests/*result*.txt
          git commit -q -m "自動存檔 [skip ci]" || echo "無變更"
          git push -q
          git add tests/*result*.txt
          git commit -m "連線測試結果 [skip ci]" || echo "無變更"
          git push
