name: 連線測試

on:
  push:
    paths:
      - "tests/**"
      - ".github/workflows/connectivity-test.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests yfinance
      - run: python tests/probe_tw.py | tee tests/probe_tw_result.txt
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
      - name: 把測試結果存回專案
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add tests/*result*.txt
          git commit -m "連線測試結果 [skip ci]" || echo "無變更"
          git push
