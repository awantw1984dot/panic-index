name: 更新資料

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pandas requests yfinance
      - name: 美股
        run: |
          set -o pipefail
          mkdir -p logs
          python src/fetch_us.py 2>&1 | tee logs/us.txt
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
      - name: 台股
        if: always()
        run: |
          set -o pipefail
          python src/fetch_tw.py 2>&1 | tee logs/tw.txt
        env:
          MAX_MINUTES: "300"
      - name: 先存資料
        if: always()
        run: bash .github/save.sh "更新資料"
      - name: 計算分數
        run: |
          set -o pipefail
          python src/score.py 2>&1 | tee logs/score.txt
      - name: 存分數與網頁資料
        if: always()
        run: bash .github/save.sh "更新分數"
