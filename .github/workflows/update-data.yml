name: 更新資料

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pandas requests yfinance
      - name: 美股
        run: python src/fetch_us.py 2>&1 | tee logs_us.txt
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
      - name: 台股
        if: always()
        run: python src/fetch_tw.py 2>&1 | tee logs_tw.txt
        env:
          MAX_MINUTES: "300"
      - name: 計算分數
        if: always()
        run: python src/score.py 2>&1 | tee logs_score.txt
      - name: 存回專案
        if: always()
        run: |
          mkdir -p logs && mv logs_*.txt logs/ 2>/dev/null || true
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          mkdir -p /tmp/keep && cp -r --parents data logs docs /tmp/keep/ 2>/dev/null || true
          git fetch -q origin main && git reset -q --hard origin/main
          cp -r /tmp/keep/. . 
          git add data logs docs
          git commit -q -m "自動存檔 [skip ci]" || echo "無變更"
          git push -q

