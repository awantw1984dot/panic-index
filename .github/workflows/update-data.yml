name: 更新資料

on:
  workflow_dispatch:
  schedule:
    # 避開整點與半點（GitHub 排程在這些時間最容易延遲）
    - cron: "43 13 * * 1-5"   # 台北 21:43（台股融資資料公布後）
    - cron: "43 23 * * 1-5"   # 台北隔日 07:43（美股收盤後）

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pandas requests yfinance exchange_calendars==4.13.2
      - name: 還原 ICE 利差快取（不公開）
        uses: actions/cache@v4
        with:
          path: data/fred_ice.csv
          key: fred-ice-${{ github.run_id }}
          restore-keys: fred-ice-
      - name: 美股
        run: |
          set -o pipefail
          mkdir -p logs
          python src/fetch_us.py 2>&1 | tee logs/us.txt
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
      - name: 台股
        if: always()
        run: |
          set -o pipefail
          python src/fetch_tw.py 2>&1 | tee logs/tw.txt
        env:
          MAX_MINUTES: "300"
      - name: 先存資料
        if: always()
        run: bash .github/save.sh "更新資料"
      - name: 計算分數
        if: always()
        run: |
          set -o pipefail
          python src/score.py 2>&1 | tee logs/score.txt
      - name: 存分數與網頁資料
        if: always()
        run: bash .github/save.sh "更新分數"
